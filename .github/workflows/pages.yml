# VeganToGo: veröffentlicht die App und prüft täglich, ob sich die Zutaten-Datenbank geändert hat.
name: Veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # täglich 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Zutaten-Datenbank prüfen und ggf. aktualisieren
        if: github.event_name != 'push'
        run: |
          tools/update-tax.sh tax-data.js tools/analyse.js
          if ! git diff --quiet -- tax-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Zutaten-Datenbank automatisch aktualisiert" -- tax-data.js
            git push -q
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/ocr
          cp index.html sw.js tax-data.js .nojekyll _site/
          cp ocr/* _site/ocr/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
