# VeganToGo: veröffentlicht die App und prüft täglich, ob sich die Zutaten-Datenbank geändert hat.
name: Veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # täglich 03:17 UTC
  workflow_dispatch:

# Bausteine sind per Commit-Hash fixiert (Schutz vor nachträglich veränderten Versionen).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Zutaten-Datenbank prüfen und ggf. aktualisieren
        if: github.event_name != 'push'
        run: |
          tools/update-tax.sh tax-data.js tools/analyse.js
          if ! git diff --quiet -- tax-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "Zutaten-Datenbank automatisch aktualisiert" -- tax-data.js
            git push -q
          fi

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/ocr
          cp index.html sw.js tax-data.js apple-touch-icon.png manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png .nojekyll _site/
          cp ocr/* _site/ocr/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
